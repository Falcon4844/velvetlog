                        </p>
                    </div>
                    <button onclick="copyAllForAi()" class="w-full py-3.5 px-4 rounded-[14px] bg-[#A78BFA] text-[#0B0B0E] font-semibold text-xs sm:text-sm btn-press">
                        Скопировать всё для ИИ (Данные + Промпт)
                    </button>
                    <div class="grid grid-cols-2 gap-2 pt-0.5">
                        <button onclick="downloadJsonBackup()" class="py-2.5 px-3 rounded-[13px] bg-white/[0.04] border border-white/[0.07] text-[11px] font-medium text-zinc-200 btn-press">
                            Скачать полный бэкап (.json)
                        </button>
                        <button onclick="downloadCsvExport()" class="py-2.5 px-3 rounded-[13px] bg-white/[0.04] border border-white/[0.07] text-[11px] font-medium text-zinc-200 btn-press">
                            Экспорт в CSV
                        </button>
                    </div>
                </div>

                <!-- Шаг 2: Загрузить ответ от ИИ или бэкап -->
                <div class="obsidian-card p-4 space-y-3">
                    <div class="space-y-1">
                        <div class="text-[11px] font-semibold text-[#6EE7B7]">Шаг 2</div>
                        <h3 class="text-sm font-semibold text-white">Загрузить ответ от ИИ или бэкап</h3>
                        <p class="text-xs text-zinc-400 leading-relaxed">
                            Вставьте ответ от нейросети — советы автоматически появятся в карточках упражнений, а веса в программе обновятся.
                        </p>
                    </div>
                    <textarea id="inline-ai-json" rows="4" placeholder='Вставьте JSON-ответ от нейросети сюда...'
                        class="w-full obsidian-sub p-3 text-xs font-mono text-[#6EE7B7] focus:outline-none focus:border-[#A78BFA]/60"></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyInlineJson()" class="py-3 px-3 rounded-[14px] bg-[#6EE7B7] text-[#0B0B0E] font-semibold text-xs btn-press">
                            Применить
                        </button>
                        <label class="py-3 px-3 rounded-[14px] bg-white/[0.05] border border-white/[0.08] text-white font-medium text-xs flex items-center justify-center cursor-pointer btn-press">
                            <span>Загрузить .json</span>
                            <input type="file" accept=".json,application/json" onchange="handleJsonFileUpload(event)" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- Помощник для старта с нуля -->
                <div class="obsidian-card p-4 space-y-2.5">
                    <h3 class="text-sm font-semibold text-white">Создание программы с нуля</h3>
                    <p class="text-xs text-zinc-400 leading-relaxed">
                        Если программы ещё нет, скопируйте этот шаблон запроса, отправьте нейросети и вставьте полученный JSON в поле выше.
                    </p>
                    <button onclick="copyStarterProgramPrompt()" class="w-full py-3 px-4 rounded-[14px] bg-white/[0.04] border border-white/[0.07] text-xs font-medium text-[#A78BFA] btn-press">
                        Скопировать промпт для создания новой программы
                    </button>
                </div>

                <!-- Активные советы ИИ -->
                <div class="obsidian-card p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-white">Активные советы ИИ</h3>
                        <span class="text-[11px] text-zinc-500 tabular">${exComments.length + dateComments.length}</span>
                    </div>
                    ${activeNotesHtml}
                </div>

                <!-- Очистка данных -->
                <div class="pt-1 pb-2 text-center">
                    <button onclick="askClearAllData()" class="px-4 py-2.5 rounded-xl text-xs font-medium text-[#FDA4AF]/80 hover:text-[#FDA4AF] btn-press">
                        Очистить все локальные данные
                    </button>
                </div>
            `;
        }

        function copyAllForAi() {
            copyToClipboard(buildFullAiSyncPrompt(), 'Данные и промпт скопированы — вставьте в чат с ИИ');
        }

        function deleteExAiComment(key) {
            delete state.aiData.exerciseComments[key];
            saveState();
            render();
            toast('Совет удалён');
        }

        function deleteDateAiComment(iso) {
            delete state.aiData.dateComments[iso];
            saveState();
            render();
            toast('Комментарий удалён');
        }

        function openJsonImportModal() {
            openModal('Импорт JSON', `
                <div class="space-y-3">
                    <p class="text-xs text-zinc-400 leading-relaxed">
                        Вставьте JSON с программой, комментариями нейросети или полным бэкапом:
                    </p>
                    <textarea id="modal-json-input" rows="7" placeholder='{ "programs": [...], "ai_comments": [...] }'
                        class="w-full obsidian-sub p-3 text-xs font-mono text-[#6EE7B7] focus:outline-none focus:border-[#A78BFA]/60"></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="submitModalJson()" class="py-3.5 rounded-[14px] bg-[#6EE7B7] text-[#0B0B0E] font-semibold text-xs sm:text-sm btn-press">
                            Применить
                        </button>
                        <label class="py-3.5 rounded-[14px] bg-white/[0.06] border border-white/[0.08] text-white font-medium text-xs sm:text-sm flex items-center justify-center cursor-pointer btn-press">
                            <span>Файл .json</span>
                            <input type="file" accept=".json,application/json" onchange="handleJsonFileUpload(event, true)" class="hidden">
                        </label>
                    </div>
                </div>
            `);
        }

        function submitModalJson() {
            const raw = document.getElementById('modal-json-input').value.trim();
            if (!raw) return toast('Вставьте текст JSON', 'error');
            if (parseAndApplySmartJson(raw)) closeModal();
        }

        function applyInlineJson() {
            const area = document.getElementById('inline-ai-json');
            const raw = area?.value.trim();
            if (!raw) return toast('Вставьте ответ от ИИ в текстовое поле', 'error');
            if (parseAndApplySmartJson(raw)) {
                area.value = '';
            }
        }

        function handleJsonFileUpload(e, shouldCloseModal = false) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                if (parseAndApplySmartJson(ev.target.result) && shouldCloseModal) {
                    closeModal();
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        /**
         * Умный парсер JSON: очищает ```json, сопоставляет упражнения по ID и названию,
         * применяет советы ИИ, обновляет веса/подходы и импортирует программы/бэкапы.
         */
        function parseAndApplySmartJson(rawText) {
            try {
                let cleaned = rawText.trim();
                const fenceMatch = cleaned.match(/```(?:json)?\s*([\s\S]*?)```/i);
                if (fenceMatch) cleaned = fenceMatch[1].trim();

                const data = JSON.parse(cleaned);
                const appliedSummary = [];

                // 1. Импорт истории тренировок (если загружается полный бэкап)
                if (Array.isArray(data.workouts)) {
                    const existingIds = new Set(state.workouts.map(w => w.id));
                    const freshWorkouts = data.workouts.filter(w => !existingIds.has(w.id));
                    if (freshWorkouts.length > 0) {
                        state.workouts = [...state.workouts, ...freshWorkouts];
                        appliedSummary.push(`тренировок: +${freshWorkouts.length}`);
                    }
                }

                // 2. Восстановление заметок из полного бэкапа
                if (data.current_ai_notes) {
                    if (data.current_ai_notes.generalComment) {
                        state.aiData.generalComment = data.current_ai_notes.generalComment;
                    }
                    Object.assign(state.aiData.dateComments, data.current_ai_notes.dateComments || {});
                    Object.assign(state.aiData.exerciseComments, data.current_ai_notes.exerciseComments || {});
                }

                // 3. Импорт новых тренировочных дней (programs)
                if (Array.isArray(data.programs) && data.programs.length > 0) {
                    const existingDayIds = new Set(state.programs.map(p => p.id));
                    const normalizedDays = data.programs
                        .filter(p => !p.id || !existingDayIds.has(p.id))
                        .map((p, idx) => ({
                            id: p.id || ('day_' + Date.now() + '_' + idx),
                            name: p.name || `День ${state.programs.length + idx + 1}`,
                            exercises: Array.isArray(p.exercises) ? p.exercises.map((ex, j) => ({
                                id: ex.id || ('pex_' + Date.now() + '_' + idx + '_' + j),
                                name: ex.name || 'Упражнение',
                                muscle: MUSCLE_LIST.includes(ex.muscle) ? ex.muscle : 'Ягодицы',
                                targetSets: parseInt(ex.targetSets) || 3,
                                targetReps: parseInt(ex.targetReps) || 12,
                                targetWeight: ex.targetWeight || ''
                            })) : []
                        }));

                    if (normalizedDays.length > 0) {
                        state.programs = [...state.programs, ...normalizedDays];
                        if (!state.selectedDayId || state.selectedDayId === 'free') {
                            state.selectedDayId = normalizedDays[0].id;
                        }
                        appliedSummary.push(`дней программы: +${normalizedDays.length}`);
                    }
                }

                // 4. Общий комментарий ИИ
                if (typeof data.general_comment === 'string' && data.general_comment.trim()) {
                    state.aiData.generalComment = data.general_comment.trim();
                    appliedSummary.push('общий вывод ИИ');
                }

                // 5. Единый массив ai_comments (поддержка и упражнений, и дат) + обратная совместимость с exercise_comments / date_comments
                let exTipsCount = 0;
                let dateTipsCount = 0;

                const unifiedComments = [
                    ...(Array.isArray(data.ai_comments) ? data.ai_comments : []),
                    ...(Array.isArray(data.exercise_comments) ? data.exercise_comments : []),
                    ...(Array.isArray(data.date_comments) ? data.date_comments : [])
                ];

                unifiedComments.forEach(item => {
                    const text = (item?.comment || '').trim();
                    if (!text) return;

                    const hasEx = Boolean(item.exercise_id || item.exercise_name || item.name);
                    if (hasEx) {
                        const label = (item.exercise_name || item.name || item.exercise_id).trim();
                        if (item.exercise_id) {
                            state.aiData.exerciseComments[item.exercise_id] = { label, comment: text };
                        }
                        if (item.exercise_name || item.name) {
                            state.aiData.exerciseComments[normKey(item.exercise_name || item.name)] = { label, comment: text };
                        }
                        exTipsCount++;
                    } else if (item.date) {
                        state.aiData.dateComments[item.date.trim()] = text;
                        dateTipsCount++;
                    }
                });

                if (exTipsCount > 0) appliedSummary.push(`советов к упр.: ${exTipsCount}`);
                if (dateTipsCount > 0) appliedSummary.push(`заметок к датам: ${dateTipsCount}`);

                // 6. Автообновление весов, подходов, повторений и замен в программе (program_updates)
                if (Array.isArray(data.program_updates)) {
                    let updatesCount = 0;
                    data.program_updates.forEach(upd => {
                        const dayId = upd.program_day_id;
                        const dayName = normKey(upd.day_name);
                        const exId = upd.exercise_id;
                        const exName = normKey(upd.exercise_name);

                        state.programs.forEach(prog => {
                            const dayOk = (dayId && prog.id === dayId) ||
                                          (dayName && normKey(prog.name) === dayName) ||
                                          (!dayId && !dayName);
                            if (!dayOk) return;

                            prog.exercises.forEach(ex => {
                                const exOk = (exId && ex.id === exId) || (exName && normKey(ex.name) === exName);
                                if (!exOk) return;

                                if (upd.new_weight !== undefined && upd.new_weight !== null && upd.new_weight !== '') {
                                    ex.targetWeight = parseFloat(upd.new_weight);
                                }
                                if (upd.new_sets) ex.targetSets = parseInt(upd.new_sets);
                                if (upd.new_reps) ex.targetReps = parseInt(upd.new_reps);
                                if (upd.replace_with_name && upd.replace_with_name.trim()) {
                                    ex.name = upd.replace_with_name.trim();
                                }
                                delete state.drafts[prog.id];
                                updatesCount++;
                            });
                        });
                    });
                    if (updatesCount > 0) appliedSummary.push(`обновлений плана: ${updatesCount}`);
                }

                if (appliedSummary.length === 0) {
                    toast('В JSON не найдено подходящих данных для применения', 'error');
                    return false;
                }

                saveState();
                render();
                toast(`Успешно применено: ${appliedSummary.join(', ')}`);
                return true;
            } catch (err) {
                toast('Некорректный формат JSON. Проверьте скобки и кавычки', 'error');
                return false;
            }
        }

        function downloadJsonBackup() {
            const payload = {
                app: 'VelvetLog',
                exportedAt: new Date().toISOString(),
                programs: state.programs,
                workouts: state.workouts,
                current_ai_notes: state.aiData
            };
            triggerFileDownload(
                JSON.stringify(payload, null, 2),
                `velvetlog_backup_${todayISO()}.json`,
                'application/json'
            );
            toast('Полный бэкап скачан');
        }

        function downloadCsvExport() {
            const rows = [['Дата', 'Тренировка', 'Группа мышц', 'Упражнение', 'Подход', 'Вес (кг)', 'Повторения', 'Тоннаж (кг)', 'Заметка']];
            state.workouts.forEach(w => {
                w.entries.forEach(e => {
                    e.sets.forEach((s, idx) => {
                        const ton = (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0);
                        rows.push([
                            w.date,
                            w.dayName,
                            e.muscle,
                            e.name,
                            idx + 1,
                            s.weight,
                            s.reps,
                            ton,
                            w.feelingNote || ''
                        ]);
                    });
                });
            });

            const csvContent = '\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
            triggerFileDownload(csvContent, `velvetlog_workouts_${todayISO()}.csv`, 'text/csv;charset=utf-8;');
            toast('CSV-файл экспортирован');
        }

        function triggerFileDownload(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function askClearAllData() {
            openModal('Очистить все данные?', `
                <div class="space-y-4">
                    <p class="text-xs text-zinc-400 leading-relaxed">
                        Будут удалены все программы, история тренировок и советы нейросети с этого устройства. Рекомендуем сначала скачать бэкап.
                    </p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="closeModal()" class="py-3 rounded-[14px] bg-white/[0.06] text-white text-xs font-medium btn-press">Отмена</button>
                        <button onclick="confirmClearAllData()" class="py-3 rounded-[14px] bg-[#FDA4AF] text-[#0B0B0E] text-xs font-semibold btn-press">Удалить всё</button>
                    </div>
                </div>
            `);
        }

        function confirmClearAllData() {
            localStorage.removeItem(STORAGE_KEY);
            state.programs = [];
            state.workouts = [];
            state.aiData = { generalComment: '', dateComments: {}, exerciseComments: {} };
            state.drafts = {};
            state.selectedDayId = null;
            state.sessionStartedAt = null;
            stopRestTimer();
            closeModal();
            setTab('workout');
            toast('Все локальные данные очищены');
        }

        // Инициализация при запуске
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            render();
        });
    </script>
