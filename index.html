        /**
         * ============================================================================
         * 6. ВКЛАДКА 1: АКТИВНАЯ ТРЕНИРОВКА В ЗАЛЕ
         * ============================================================================
         */
        function ensureSessionDraft(sessionId, programExercises = []) {
            if (!state.drafts[sessionId]) {
                state.drafts[sessionId] = {
                    exercises: JSON.parse(JSON.stringify(programExercises)),
                    sets: {}
                };
            }
            const draft = state.drafts[sessionId];
            draft.exercises.forEach(ex => {
                if (!draft.sets[ex.id]) {
                    const last = getLastPerformance(ex.name);
                    if (last) {
                        draft.sets[ex.id] = last.sets.map(s => ({
                            weight: '',
                            reps: '',
                            placeholderWeight: ex.targetWeight || s.weight || '0',
                            placeholderReps: s.reps || ex.targetReps || '10',
                            done: false
                        }));
                    } else {
                        const count = Math.max(1, parseInt(ex.targetSets) || 3);
                        const pReps = String(ex.targetReps || 10);
                        const pWeight = ex.targetWeight ? String(ex.targetWeight) : '0';
                        draft.sets[ex.id] = Array.from({ length: count }, () => ({
                            weight: '',
                            reps: '',
                            placeholderWeight: pWeight,
                            placeholderReps: pReps,
                            done: false
                        }));
                    }
                }
            });
            return draft;
        }

        function getEffectiveSetValues(s) {
            const w = s.weight !== '' && s.weight !== undefined
                ? parseFloat(s.weight) || 0
                : parseFloat(s.placeholderWeight) || 0;
            const r = s.reps !== '' && s.reps !== undefined
                ? parseInt(s.reps) || 0
                : parseInt(s.placeholderReps) || 0;
            return { w, r };
        }

        function renderActiveWorkoutView(header, root) {
            ensureSessionTimer();

            let activeProg = null;
            if (state.selectedDayId !== 'free') {
                activeProg = state.programs.find(p => p.id === state.selectedDayId) || state.programs[0];
                if (activeProg) state.selectedDayId = activeProg.id;
            }

            const sessionId = activeProg ? activeProg.id : 'free';
            const sessionName = activeProg ? activeProg.name : 'Свободная тренировка';
            const draft = ensureSessionDraft(sessionId, activeProg ? activeProg.exercises : []);

            // Подсчет текущего тоннажа и выполненных подходов
            let liveVolume = 0;
            let doneSets = 0;
            let totalSets = 0;

            draft.exercises.forEach(ex => {
                (draft.sets[ex.id] || []).forEach(s => {
                    totalSets++;
                    if (s.done) {
                        doneSets++;
                        const { w, r } = getEffectiveSetValues(s);
                        liveVolume += w * r;
                    }
                });
            });

            const elapsedText = state.sessionStartedAt
                ? formatDuration(Math.floor((Date.now() - state.sessionStartedAt) / 1000))
                : '00:00';

            // Верхняя панель с кнопками "Сбросить" и "Завершить"
            header.innerHTML = `
                <div class="flex items-center justify-between gap-2">
                    <div class="min-w-0 flex-1">
                        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white truncate">${esc(sessionName)}</h1>
                        <div class="flex items-center gap-2 text-[11px] text-zinc-400 tabular mt-0.5">
                            <span id="header-elapsed" class="text-[#6EE7B7] font-medium">${elapsedText}</span>
                            <span>·</span>
                            <span class="text-white font-semibold">${fmtNum(liveVolume)} кг</span>
                            <span>·</span>
                            <span>${doneSets}/${totalSets} подх.</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="askResetSession('${sessionId}')" class="px-2.5 py-2 rounded-xl bg-white/[0.05] border border-white/[0.08] text-xs font-medium text-zinc-300 btn-press">
                            Сбросить
                        </button>
                        <button onclick="openFinishModal('${sessionId}', '${esc(sessionName)}')" class="px-3.5 py-2 rounded-xl bg-[#6EE7B7] text-[#0B0B0E] text-xs font-semibold shadow-sm shadow-[#6EE7B7]/20 btn-press">
                            Завершить
                        </button>
                    </div>
                </div>
            `;

            // Переключатель дней программы + тумблер "По мышцам / По порядку"
            const dayPills = state.programs.map(p => {
                const active = sessionId === p.id;
                return `
                    <button onclick="selectWorkoutSession('${p.id}')"
                        class="shrink-0 px-3.5 py-2 rounded-[13px] text-xs font-medium transition-all btn-press ${
                            active
                            ? 'bg-[#A78BFA] text-[#0B0B0E] font-semibold'
                            : 'bg-[#141419] text-zinc-400 border border-white/[0.07]'
                        }">
                        ${esc(p.name)}
                    </button>
                `;
            }).join('');

            const freePill = `
                <button onclick="startFreeSession()"
                    class="shrink-0 px-3.5 py-2 rounded-[13px] text-xs font-medium transition-all btn-press ${
                        sessionId === 'free'
                        ? 'bg-[#A78BFA] text-[#0B0B0E] font-semibold'
                        : 'bg-[#141419] text-zinc-400 border border-white/[0.07]'
                    }">
                    Свободная
                </button>
            `;

            // Совет ИИ на сегодня, если есть
            const todayNote = state.aiData.dateComments[todayISO()];
            const todayNoteHtml = todayNote ? `
                <div class="p-3.5 rounded-[18px] bg-[#A78BFA]/10 border border-[#A78BFA]/25 space-y-1">
                    <div class="text-[11px] font-semibold text-[#A78BFA]">✦ Рекомендация тренера ИИ на сегодня</div>
                    <p class="text-xs text-zinc-200 leading-relaxed break-words">${esc(todayNote)}</p>
                </div>
            ` : '';

            // Карточки упражнений
            let exercisesHtml = '';
            if (draft.exercises.length === 0) {
                exercisesHtml = `
                    <div class="obsidian-card p-6 text-center space-y-3">
                        <p class="text-xs text-zinc-400">В этой тренировке пока нет упражнений</p>
                        <button onclick="openAddSessionExerciseModal('${sessionId}')" class="px-4 py-2.5 rounded-xl bg-[#A78BFA] text-[#0B0B0E] text-xs font-semibold btn-press">
                            + Добавить упражнение
                        </button>
                    </div>
                `;
            } else if (state.groupByMuscle) {
                const grouped = {};
                draft.exercises.forEach((ex, idx) => {
                    const m = ex.muscle || 'Ягодицы';
                    if (!grouped[m]) grouped[m] = [];
                    grouped[m].push({ ex, idx });
                });

                exercisesHtml = Object.entries(grouped).map(([muscle, list]) => {
                    const st = MUSCLE_STYLES[muscle] || MUSCLE_STYLES['Ягодицы'];
                    return `
                        <div class="space-y-2.5">
                            <div class="flex items-center gap-2 px-1 pt-1">
                                <span class="w-2 h-2 rounded-full ${st.dot}"></span>
                                <span class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400">${esc(muscle)}</span>
                                <div class="h-px bg-white/[0.06] flex-1"></div>
                            </div>
                            ${list.map(({ ex, idx }) => renderWorkoutExerciseCard(sessionId, draft, ex, idx)).join('')}
                        </div>
                    `;
                }).join('');
            } else {
                exercisesHtml = draft.exercises.map((ex, idx) => renderWorkoutExerciseCard(sessionId, draft, ex, idx)).join('');
            }

            root.innerHTML = `
                <!-- Выбор дня -->
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
                    ${dayPills}
                    ${freePill}
                </div>

                <!-- Тумблер группировки -->
                <div class="flex items-center justify-between gap-2">
                    <div class="inline-flex p-1 rounded-[14px] bg-[#141419] border border-white/[0.07]">
                        <button onclick="setGrouping(true)" class="px-3 py-1.5 rounded-[10px] text-xs font-medium transition-all btn-press ${state.groupByMuscle ? 'bg-white/[0.1] text-white' : 'text-zinc-500'}">
                            По мышцам
                        </button>
                        <button onclick="setGrouping(false)" class="px-3 py-1.5 rounded-[10px] text-xs font-medium transition-all btn-press ${!state.groupByMuscle ? 'bg-white/[0.1] text-white' : 'text-zinc-500'}">
                            По порядку
                        </button>
                    </div>
                    ${activeProg ? `
                        <button onclick="reloadFromProgram('${activeProg.id}')" class="text-[11px] font-medium text-zinc-400 hover:text-white px-2 py-1 btn-press">
                            Обновить из плана
                        </button>
                    ` : ''}
                </div>

                ${todayNoteHtml}

                <!-- Список карточек упражнений -->
                <div class="space-y-3.5">
                    ${exercisesHtml}
                </div>

                <!-- Кнопка добавить упражнение на лету -->
                <button onclick="openAddSessionExerciseModal('${sessionId}')"
                    class="w-full py-3.5 px-4 rounded-[18px] bg-[#141419] border border-dashed border-white/[0.12] text-zinc-300 hover:text-white text-xs font-medium flex items-center justify-center gap-1.5 btn-press">
                    <span>+ Добавить упражнение</span>
                </button>
            `;
        }

        function renderWorkoutExerciseCard(sessionId, draft, ex, idx) {
            const sets = draft.sets[ex.id] || [];
            const last = getLastPerformance(ex.name);
            const aiTip = getAiTipForExercise(ex);
            const st = MUSCLE_STYLES[ex.muscle] || MUSCLE_STYLES['Ягодицы'];

            const prevHint = last
                ? `Прошлый раз: ${last.sets.map(s => `${s.weight} кг × ${s.reps}`).join(' · ')}`
                : (ex.targetSets || ex.targetReps ? `Цель: ${ex.targetSets || 3}×${ex.targetReps || 10}${ex.targetWeight ? ` (${ex.targetWeight} кг)` : ''}` : 'Первая запись');

            const aiBanner = aiTip ? `
                <div class="px-3 py-2.5 rounded-[14px] bg-[#A78BFA]/10 border border-[#A78BFA]/20 text-xs text-zinc-200 leading-snug break-words">
                    <span class="font-semibold text-[#A78BFA]">✦ Совет тренера:</span> ${esc(aiTip)}
                </div>
            ` : '';

            const setsHtml = sets.map((s, sIdx) => `
                <div class="flex items-center gap-2">
                    <span class="w-5 text-center text-xs font-semibold tabular shrink-0 ${s.done ? 'text-[#6EE7B7]' : 'text-zinc-500'}">${sIdx + 1}</span>

                    <!-- Вес (кг) -->
                    <div class="flex-1 min-w-0 relative">
                        <input type="number" inputmode="decimal" step="0.5"
                            placeholder="${esc(s.placeholderWeight ?? '0')}"
                            value="${s.weight !== undefined ? s.weight : ''}"
                            onchange="updateSetInput('${sessionId}', '${ex.id}', ${sIdx}, 'weight', this.value)"
                            class="w-full h-11 bg-[#1C1C24] border ${s.done ? 'border-[#6EE7B7]/40 text-[#6EE7B7]' : 'border-white/[0.07] text-white'} rounded-[13px] pl-2 pr-6 text-center text-sm font-semibold tabular placeholder:text-zinc-600 focus:outline-none focus:border-[#A78BFA]/60">
                        <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] text-zinc-500 pointer-events-none">кг</span>
                    </div>

                    <!-- Повторения -->
                    <div class="flex-1 min-w-0 relative">
                        <input type="number" inputmode="numeric"
                            placeholder="${esc(s.placeholderReps ?? '10')}"
                            value="${s.reps !== undefined ? s.reps : ''}"
                            onchange="updateSetInput('${sessionId}', '${ex.id}', ${sIdx}, 'reps', this.value)"
                            class="w-full h-11 bg-[#1C1C24] border ${s.done ? 'border-[#6EE7B7]/40 text-[#6EE7B7]' : 'border-white/[0.07] text-white'} rounded-[13px] pl-2 pr-8 text-center text-sm font-semibold tabular placeholder:text-zinc-600 focus:outline-none focus:border-[#A78BFA]/60">
                        <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-zinc-500 pointer-events-none">повт</span>
                    </div>

                    <!-- Крупная тактильная кнопка выполнения -->
                    <button onclick="toggleSetDone('${sessionId}', '${ex.id}', ${sIdx})"
                        class="w-11 h-11 rounded-full flex items-center justify-center shrink-0 transition-all btn-press ${
                            s.done
                            ? 'bg-[#6EE7B7] text-[#0B0B0E] shadow-md shadow-[#6EE7B7]/25'
                            : 'bg-[#1C1C24] border border-white/[0.09] text-zinc-500'
                        }" aria-label="Отметить подход">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </button>

                    <!-- Удалить подход -->
                    ${sets.length > 1 ? `
                        <button onclick="removeSetRow('${sessionId}', '${ex.id}', ${sIdx})"
                            class="w-6 h-11 flex items-center justify-center shrink-0 text-zinc-600 hover:text-[#FDA4AF] btn-press" aria-label="Удалить подход">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    ` : `<div class="w-6 shrink-0"></div>`}
                </div>
            `).join('');

            return `
                <div class="obsidian-card p-4 space-y-3">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1 space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h4 class="text-[15px] font-semibold text-white leading-snug break-words">${esc(ex.name)}</h4>
                                <span class="px-2 py-0.5 rounded-lg border text-[10px] font-medium shrink-0 ${st.badge}">${esc(ex.muscle)}</span>
                            </div>
                            <p class="text-[11px] text-zinc-400 tabular break-words">${prevHint}</p>
                        </div>

                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="moveSessionEx('${sessionId}', ${idx}, -1)" ${idx === 0 ? 'disabled' : ''} class="icon-btn text-zinc-400 disabled:opacity-25 btn-press" title="Выше">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
                            </button>
                            <button onclick="moveSessionEx('${sessionId}', ${idx}, 1)" ${idx === draft.exercises.length - 1 ? 'disabled' : ''} class="icon-btn text-zinc-400 disabled:opacity-25 btn-press" title="Ниже">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            <button onclick="openSwapSessionExModal('${sessionId}', ${idx})" class="icon-btn text-[#A78BFA] btn-press" title="Заменить упражнение">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            </button>
                            <button onclick="removeSessionEx('${sessionId}', ${idx})" class="icon-btn text-zinc-500 hover:text-[#FDA4AF] btn-press" title="Убрать">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                    </div>

                    ${aiBanner}

                    <div class="space-y-2 pt-0.5">
                        ${setsHtml}
                    </div>

                    <button onclick="addSetRow('${sessionId}', '${ex.id}')"
                        class="w-full py-2.5 rounded-[13px] bg-white/[0.03] hover:bg-white/[0.06] text-xs font-medium text-zinc-400 hover:text-zinc-200 btn-press">
                        + Добавить подход
                    </button>
                </div>
            `;
        }

        function selectWorkoutSession(dayId) {
            state.selectedDayId = dayId;
            saveState();
            render();
        }

        function startFreeSession() {
            state.selectedDayId = 'free';
            if (!state.sessionStartedAt) state.sessionStartedAt = Date.now();
            saveState();
            render();
        }

        function setGrouping(byMuscle) {
            state.groupByMuscle = byMuscle;
            saveState();
            render();
        }

        function updateSetInput(sessionId, exId, sIdx, field, val) {
            const arr = state.drafts[sessionId]?.sets[exId];
            if (arr && arr[sIdx]) {
                arr[sIdx][field] = val === '' ? '' : (field === 'weight' ? parseFloat(val) : parseInt(val));
                saveState();
                render();
            }
        }

        function toggleSetDone(sessionId, exId, sIdx) {
            const arr = state.drafts[sessionId]?.sets[exId];
            if (arr && arr[sIdx]) {
                const becomingDone = !arr[sIdx].done;
                arr[sIdx].done = becomingDone;
                // При отметке подставляем значения из плейсхолдера, если пользователь их не менял
                if (becomingDone) {
                    if (arr[sIdx].weight === '' || arr[sIdx].weight === undefined) {
                        arr[sIdx].weight = parseFloat(arr[sIdx].placeholderWeight) || 0;
                    }
                    if (arr[sIdx].reps === '' || arr[sIdx].reps === undefined) {
                        arr[sIdx].reps = parseInt(arr[sIdx].placeholderReps) || 10;
                    }
                    startRestTimer(state.restPreset);
                }
                saveState();
                render();
            }
        }

        function addSetRow(sessionId, exId) {
            const arr = state.drafts[sessionId]?.sets[exId];
            if (arr) {
                const prev = arr[arr.length - 1] || { weight: '', reps: '', placeholderWeight: '0', placeholderReps: '10' };
                arr.push({
                    weight: prev.weight,
                    reps: prev.reps,
                    placeholderWeight: prev.placeholderWeight,
                    placeholderReps: prev.placeholderReps,
                    done: false
                });
                saveState();
                render();
            }
        }

        function removeSetRow(sessionId, exId, sIdx) {
            const arr = state.drafts[sessionId]?.sets[exId];
            if (arr && arr.length > 1) {
                arr.splice(sIdx, 1);
                saveState();
                render();
            }
        }

        function moveSessionEx(sessionId, idx, dir) {
            const d = state.drafts[sessionId];
            if (!d) return;
            const to = idx + dir;
            if (to < 0 || to >= d.exercises.length) return;
            [d.exercises[idx], d.exercises[to]] = [d.exercises[to], d.exercises[idx]];
            saveState();
            render();
        }

        function removeSessionEx(sessionId, idx) {
            const d = state.drafts[sessionId];
            if (!d) return;
            const [rem] = d.exercises.splice(idx, 1);
            if (rem) delete d.sets[rem.id];
            saveState();
            render();
            toast('Упражнение убрано из тренировки');
        }

        function reloadFromProgram(progId) {
            const prog = state.programs.find(p => p.id === progId);
            if (!prog) return;
            delete state.drafts[progId];
            ensureSessionDraft(progId, prog.exercises);
            saveState();
            render();
            toast('Список обновлен по шаблону дня');
        }

        function askResetSession(sessionId) {
            openModal('Сбросить текущую тренировку?', `
                <div class="space-y-4">
                    <p class="text-xs text-zinc-400 leading-relaxed">
                        Все галочки выполненных подходов и таймер текущей сессии будут сброшены. Сохранённые ранее тренировки в календаре останутся.
                    </p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="closeModal()" class="py-3 rounded-[14px] bg-white/[0.06] text-white text-xs font-medium btn-press">Отмена</button>
                        <button onclick="confirmResetSession('${sessionId}')" class="py-3 rounded-[14px] bg-[#FDA4AF] text-[#0B0B0E] text-xs font-semibold btn-press">Сбросить</button>
                    </div>
                </div>
            `);
        }

        function confirmResetSession(sessionId) {
            delete state.drafts[sessionId];
            state.sessionStartedAt = Date.now();
            stopRestTimer();
            if (sessionId === 'free' && state.programs.length === 0) {
                state.selectedDayId = null;
                state.sessionStartedAt = null;
            }
            saveState();
            closeModal();
            render();
            toast('Тренировка сброшена');
        }

        // Модалка добавления упражнения на лету (с галочкой "Сохранить в шаблон дня")
        function openAddSessionExerciseModal(sessionId) {
            const isProgDay = sessionId !== 'free' && state.programs.some(p => p.id === sessionId);
            const opts = MUSCLE_LIST.map(m => `<option value="${m}">${m}</option>`).join('');

            openModal('Добавить упражнение', `
                <div class="space-y-3.5">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Название упражнения</label>
                        <input id="add-sess-ex-name" type="text" placeholder="Например: Ягодичный мостик в тренажёре"
                            class="w-full obsidian-sub px-3.5 py-3 text-sm text-white focus:outline-none focus:border-[#A78BFA]/60">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Группа мышц</label>
                        <select id="add-sess-ex-muscle" class="w-full obsidian-sub px-3.5 py-3 text-sm text-white focus:outline-none">
                            ${opts}
                        </select>
                    </div>
                    ${isProgDay ? `
                        <label class="flex items-center gap-2.5 p-3 rounded-[14px] bg-white/[0.03] border border-white/[0.06] cursor-pointer">
                            <input id="add-sess-save-tpl" type="checkbox" checked class="w-4 h-4 accent-[#A78BFA] rounded">
                            <span class="text-xs text-zinc-300">Сохранить также в шаблон этого дня</span>
                        </label>
                    ` : ''}
                    <button onclick="submitAddSessionExercise('${sessionId}')"
                        class="w-full py-3.5 rounded-[14px] bg-[#A78BFA] text-[#0B0B0E] font-semibold text-sm btn-press">
                        Добавить в тренировку
                    </button>
                </div>
            `);
        }

        function submitAddSessionExercise(sessionId) {
            const name = document.getElementById('add-sess-ex-name').value.trim();
            const muscle = document.getElementById('add-sess-ex-muscle').value;
            const saveToTpl = document.getElementById('add-sess-save-tpl')?.checked || false;

            if (!name) return toast('Введите название упражнения', 'error');

            const newEx = {
                id: 'ex_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                name,
                muscle,
                targetSets: 3,
                targetReps: 12,
                targetWeight: ''
            };

            const draft = ensureSessionDraft(sessionId);
            draft.exercises.push(newEx);
            ensureSessionDraft(sessionId);

            if (saveToTpl && sessionId !== 'free') {
                const prog = state.programs.find(p => p.id === sessionId);
                if (prog) prog.exercises.push({ ...newEx });
            }

            saveState();
            closeModal();
            render();
            toast('Упражнение добавлено');
        }

        // Модалка замены упражнения во время сессии
        function openSwapSessionExModal(sessionId, exIdx) {
            const d = state.drafts[sessionId];
            const cur = d?.exercises[exIdx];
            if (!cur) return;

            const opts = MUSCLE_LIST.map(m => `<option value="${m}" ${cur.muscle === m ? 'selected' : ''}>${m}</option>`).join('');

            // Подбор упражнений той же группы мышц из базы
            const pool = new Map();
            state.programs.forEach(p => p.exercises.forEach(e => pool.set(normKey(e.name), e)));
            state.workouts.forEach(w => w.entries.forEach(e => pool.set(normKey(e.name), { name: e.name, muscle: e.muscle })));
            const sameMuscle = Array.from(pool.values()).filter(x => x.muscle === cur.muscle && normKey(x.name) !== normKey(cur.name));

            const altsHtml = sameMuscle.length ? `
                <div class="pt-3 border-t border-white/[0.07] space-y-2">
                    <div class="text-[11px] font-medium text-zinc-400">Из вашей базы (${esc(cur.muscle)})</div>
                    <div class="space-y-1.5 max-h-40 overflow-y-auto">
                        ${sameMuscle.map(item => `
                            <button onclick="applySwapSessionEx('${sessionId}', ${exIdx}, '${esc(item.name)}', '${esc(item.muscle)}')"
                                class="w-full text-left p-3 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] flex items-center justify-between gap-2 btn-press">
                                <span class="text-xs font-medium text-white break-words min-w-0">${esc(item.name)}</span>
                                <span class="text-[10px] text-[#A78BFA] shrink-0">Выбрать</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            openModal('Заменить упражнение', `
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Новое название (если тренажёр занят)</label>
                        <input id="swap-ex-name" type="text" placeholder="Введите замену"
                            class="w-full obsidian-sub px-3.5 py-3 text-sm text-white focus:outline-none focus:border-[#A78BFA]/60">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Группа мышц</label>
                        <select id="swap-ex-muscle" class="w-full obsidian-sub px-3.5 py-3 text-sm text-white focus:outline-none">
                            ${opts}
                        </select>
                    </div>
                    <button onclick="submitSwapSessionEx('${sessionId}', ${exIdx})"
                        class="w-full py-3.5 rounded-[14px] bg-[#A78BFA] text-[#0B0B0E] font-semibold text-sm btn-press">
                        Заменить
                    </button>
                    ${altsHtml}
                </div>
            `);
        }

        function submitSwapSessionEx(sessionId, exIdx) {
            const name = document.getElementById('swap-ex-name').value.trim();
            const muscle = document.getElementById('swap-ex-muscle').value;
            if (!name) return toast('Введите название замены', 'error');
            applySwapSessionEx(sessionId, exIdx, name, muscle);
        }

        function applySwapSessionEx(sessionId, exIdx, name, muscle) {
            const d = state.drafts[sessionId];
            if (!d || !d.exercises[exIdx]) return;
            delete d.sets[d.exercises[exIdx].id];
            d.exercises[exIdx] = {
                id: 'ex_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                name,
                muscle,
                targetSets: 3,
                targetReps: 12
            };
            ensureSessionDraft(sessionId);
            saveState();
            closeModal();
            render();
            toast('Упражнение заменено');
        }

        // Модалка завершения тренировки с итогами и заметкой о самочувствии
        function openFinishModal(sessionId, sessionName) {
            const d = state.drafts[sessionId];
            if (!d) return;

            let totalVol = 0;
            let doneCount = 0;
            let totalCount = 0;

            d.exercises.forEach(ex => {
                (d.sets[ex.id] || []).forEach(s => {
                    totalCount++;
                    const { w, r } = getEffectiveSetValues(s);
                    if (s.done && r > 0) {
                        doneCount++;
                        totalVol += w * r;
                    }
                });
            });

            // Если галочки не ставили, посчитаем по заполненным подходам
            if (doneCount === 0) {
                d.exercises.forEach(ex => {
                    (d.sets[ex.id] || []).forEach(s => {
                        const { w, r } = getEffectiveSetValues(s);
                        if ((s.weight !== '' || s.reps !== '') && r > 0) {
                            doneCount++;
                            totalVol += w * r;
                        }
                    });
                });
            }

            const durationSec = state.sessionStartedAt ? Math.floor((Date.now() - state.sessionStartedAt) / 1000) : 0;

            openModal('Завершение тренировки', `
                <div class="space-y-4">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="obsidian-sub p-3 text-center">
                            <div class="text-[10px] text-zinc-400">Подходы</div>
                            <div class="text-base font-bold text-white tabular mt-0.5">${doneCount}</div>
                        </div>
                        <div class="obsidian-sub p-3 text-center">
                            <div class="text-[10px] text-zinc-400">Тоннаж</div>
                            <div class="text-base font-bold text-[#6EE7B7] tabular mt-0.5">${fmtNum(totalVol)} кг</div>
                        </div>
                        <div class="obsidian-sub p-3 text-center">
                            <div class="text-[10px] text-zinc-400">Время</div>
                            <div class="text-base font-bold text-[#A78BFA] tabular mt-0.5">${formatDuration(durationSec)}</div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Дата тренировки</label>
                        <input id="finish-date-in" type="date" value="${todayISO()}"
                            class="w-full obsidian-sub px-3.5 py-2.5 text-sm text-white tabular focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Самочувствие и заметки (увидит ИИ-тренер)</label>
                        <textarea id="finish-feeling-in" rows="3" placeholder="Как прошла тренировка? Например: было легко, можно прибавить вес в ягодичном мостике"
                            class="w-full obsidian-sub p-3 text-xs text-white leading-relaxed focus:outline-none focus:border-[#A78BFA]/60"></textarea>
                    </div>

                    <button onclick="saveCompletedWorkout('${sessionId}', '${esc(sessionName)}')"
                        class="w-full py-3.5 rounded-[14px] bg-[#6EE7B7] text-[#0B0B0E] font-semibold text-sm shadow-lg shadow-[#6EE7B7]/20 btn-press">
                        Сохранить тренировку
                    </button>
                </div>
            `);
        }

        function saveCompletedWorkout(sessionId, sessionName) {
            const d = state.drafts[sessionId];
            if (!d) return;

            const chosenDate = document.getElementById('finish-date-in').value || todayISO();
            const feelingNote = document.getElementById('finish-feeling-in').value.trim();

            let totalVol = 0;
            const entries = [];

            d.exercises.forEach(ex => {
                const rawSets = d.sets[ex.id] || [];
                const checked = rawSets.filter(s => s.done);
                const source = checked.length > 0 ? checked : rawSets.filter(s => s.weight !== '' || s.reps !== '');

                if (source.length > 0) {
                    const sets = source.map(s => {
                        const { w, r } = getEffectiveSetValues(s);
                        totalVol += w * r;
                        return { weight: w, reps: r, done: true };
                    }).filter(s => s.reps > 0);

                    if (sets.length > 0) {
                        entries.push({
                            exerciseId: ex.id,
                            name: ex.name,
                            muscle: ex.muscle,
                            sets
                        });
                    }
                }
            });

            if (entries.length === 0) {
                return toast('Отметьте хотя бы один выполненный подход', 'error');
            }

            const durationSec = state.sessionStartedAt ? Math.floor((Date.now() - state.sessionStartedAt) / 1000) : 0;

            state.workouts.push({
                id: 'w_' + Date.now(),
                date: chosenDate,
                dayId: sessionId,
                dayName: sessionName,
                totalVolume: Math.round(totalVol),
                durationSec,
                feelingNote,
                entries
            });

            delete state.drafts[sessionId];
            state.sessionStartedAt = null;
            stopRestTimer();
            state.calendar.selectedDate = chosenDate;

            saveState();
            closeModal();
            toast(`Тренировка сохранена · ${fmtNum(totalVol)} кг`);
            setTab('progress');
        }

        /**
         * ============================================================================
         * 7. ВКЛАДКА 2: КОНСТРУКТОР ПРОГРАММЫ
         * ============================================================================
         */
        function renderProgramTab() {
            if (state.programs.length === 0) {
                return `
                    <div class="obsidian-card p-6 text-center space-y-4 mt-2">
                        <div class="space-y-1.5">
                            <h2 class="text-base font-semibold text-white">Программа пока не создана</h2>
                            <p class="text-xs text-zinc-400 leading-relaxed max-w-xs mx-auto">
                                Создайте первый тренировочный день вручную или загрузите готовую программу от нейросети в формате JSON.
                            </p>
                        </div>
                        <div class="space-y-2.5 pt-1">
                            <button onclick="openDayModal()" class="w-full py-3.5 px-4 rounded-[14px] bg-[#A78BFA] text-[#0B0B0E] font-semibold text-sm btn-press">
                                + Создать первый день
                            </button>
                            <button onclick="openJsonImportModal()" class="w-full py-3.5 px-4 rounded-[14px] bg-white/[0.05] border border-white/[0.08] text-white font-medium text-sm btn-press">
                                Загрузить JSON от ИИ
                            </button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="space-y-3.5">
                    ${state.programs.map((prog, pIdx) => {
                        const exHtml = prog.exercises.map((ex, eIdx) => {
                            const st = MUSCLE_STYLES[ex.muscle] || MUSCLE_STYLES['Ягодицы'];
                            const tip = getAiTipForExercise(ex);
                            return `
                                <div class="p-3 rounded-[15px] bg-white/[0.03] border border-white/[0.06] flex items-center justify-between gap-2">
                                    <div class="min-w-0 flex-1">
                                        <div class="flex items-center gap-1.5 flex-wrap">
                                            <span class="w-1.5 h-1.5 rounded-full ${st.dot} shrink-0"></span>
                                            <span class="text-xs sm:text-[13px] font-medium text-white break-words">${esc(ex.name)}</span>
                                        </div>
                                        <div class="flex items-center gap-2 mt-1 flex-wrap text-[11px] text-zinc-400 tabular">
                                            <span>${esc(ex.muscle)}</span>
                                            <span>·</span>
                                            <span>${ex.targetSets || 3}×${ex.targetReps || 12}${ex.targetWeight ? ` · ${ex.targetWeight} кг` : ''}</span>
                                            ${tip ? `<span class="text-[#A78BFA]">✦ Совет ИИ</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-1 shrink-0">
                                        <button onclick="moveProgEx('${prog.id}', ${eIdx}, -1)" ${eIdx === 0 ? 'disabled' : ''} class="icon-btn text-zinc-400 disabled:opacity-25 btn-press">↑</button>
                                        <button onclick="moveProgEx('${prog.id}', ${eIdx}, 1)" ${eIdx === prog.exercises.length - 1 ? 'disabled' : ''} class="icon-btn text-zinc-400 disabled:opacity-25 btn-press">↓</button>
                                        <button onclick="openProgExModal('${prog.id}', ${eIdx})" class="icon-btn text-zinc-300 btn-press">✎</button>
                                        <button onclick="deleteProgEx('${prog.id}', ${eIdx})" class="icon-btn text-zinc-500 hover:text-[#FDA4AF] btn-press">✕</button>
                                    </div>
                                </div>
                            `;
                        }).join('');

                        return `
                            <div class="obsidian-card p-4 space-y-3">
                                <div class="flex items-center justify-between gap-2">
                                    <h3 class="text-base font-semibold text-white truncate min-w-0">${esc(prog.name)}</h3>
                                    <div class="flex items-center gap-1 shrink-0">
                                        <button onclick="moveProgDay(${pIdx}, -1)" ${pIdx === 0 ? 'disabled' : ''} class="icon-btn text-zinc-400 disabled:opacity-25 btn-press">↑</button>
                                        <button onclick="moveProgDay(${pIdx}, 1)" ${pIdx === state.programs.length - 1 ? 'disabled' : ''} class="icon-btn text-zinc-400 disabled:opacity-25 btn-press">↓</button>
                                        <button onclick="openDayModal('${prog.id}')" class="icon-btn text-zinc-300 btn-press">✎</button>
                                        <button onclick="deleteProgDay('${prog.id}')" class="icon-btn text-zinc-500 hover:text-[#FDA4AF] btn-press">✕</button>
                                    </div>
                                </div>

                                <div class="space-y-2">
                                    ${exHtml || '<p class="text-xs text-zinc-500 text-center py-2">Добавьте упражнения в этот день</p>'}
                                </div>

                                <div class="grid grid-cols-2 gap-2 pt-1">
                                    <button onclick="openProgExModal('${prog.id}')"
                                        class="py-2.5 px-3 rounded-[13px] bg-white/[0.04] border border-white/[0.07] text-xs font-medium text-zinc-200 btn-press">
                                        + Упражнение
                                    </button>
                                    <button onclick="startWorkoutFromDay('${prog.id}')"
                                        class="py-2.5 px-3 rounded-[13px] bg-[#6EE7B7]/15 border border-[#6EE7B7]/25 text-xs font-semibold text-[#6EE7B7] btn-press">
                                        Начать эту тренировку
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function startWorkoutFromDay(progId) {
            state.selectedDayId = progId;
            reloadFromProgram(progId);
            setTab('workout');
        }

        function openDayModal(progId = null) {
            const cur = progId ? state.programs.find(p => p.id === progId) : null;
            openModal(cur ? 'Переименовать день' : 'Новый день программы', `
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Название дня</label>
                        <input id="day-name-in" type="text" value="${cur ? esc(cur.name) : ''}" placeholder="Например: День 1: Ягодицы и ноги"
                            class="w-full obsidian-sub px-3.5 py-3 text-sm text-white focus:outline-none focus:border-[#A78BFA]/60">
                    </div>
                    <button onclick="saveDayModal('${progId || ''}')"
                        class="w-full py-3.5 rounded-[14px] bg-[#A78BFA] text-[#0B0B0E] font-semibold text-sm btn-press">
                        Сохранить
                    </button>
                </div>
            `);
        }

        function saveDayModal(progId) {
            const name = document.getElementById('day-name-in').value.trim();
            if (!name) return toast('Введите название дня', 'error');

            if (progId) {
                const p = state.programs.find(x => x.id === progId);
                if (p) p.name = name;
            } else {
                const newDay = { id: 'day_' + Date.now(), name, exercises: [] };
                state.programs.push(newDay);
                if (!state.selectedDayId || state.selectedDayId === 'free') state.selectedDayId = newDay.id;
            }
            saveState();
            closeModal();
            render();
            toast(progId ? 'Название обновлено' : 'День добавлен');
        }

        function moveProgDay(idx, dir) {
            const to = idx + dir;
            if (to < 0 || to >= state.programs.length) return;
            [state.programs[idx], state.programs[to]] = [state.programs[to], state.programs[idx]];
            saveState();
            render();
        }

        function deleteProgDay(progId) {
            state.programs = state.programs.filter(p => p.id !== progId);
            delete state.drafts[progId];
            if (state.selectedDayId === progId) state.selectedDayId = state.programs[0]?.id || null;
            saveState();
            render();
            toast('День удалён');
        }

        function openProgExModal(progId, exIdx = null) {
            const prog = state.programs.find(p => p.id === progId);
            if (!prog) return;
            const cur = exIdx !== null ? prog.exercises[exIdx] : null;
            const opts = MUSCLE_LIST.map(m => `<option value="${m}" ${cur?.muscle === m ? 'selected' : ''}>${m}</option>`).join('');

            openModal(cur ? 'Редактировать упражнение' : 'Добавить упражнение', `
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Название упражнения</label>
                        <input id="prog-ex-name" type="text" value="${cur ? esc(cur.name) : ''}" placeholder="Например: Румынская тяга с гантелями"
                            class="w-full obsidian-sub px-3.5 py-3 text-sm text-white focus:outline-none focus:border-[#A78BFA]/60">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1.5">Группа мышц</label>
                        <select id="prog-ex-muscle" class="w-full obsidian-sub px-3.5 py-3 text-sm text-white focus:outline-none">
                            ${opts}
                        </select>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[11px] text-zinc-400 mb-1">Подходы</label>
                            <input id="prog-ex-sets" type="number" inputmode="numeric" value="${cur ? (cur.targetSets || 3) : 3}"
                                class="w-full obsidian-sub px-2 py-2.5 text-sm text-center text-white tabular focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] text-zinc-400 mb-1">Повторы</label>
                            <input id="prog-ex-reps" type="number" inputmode="numeric" value="${cur ? (cur.targetReps || 12) : 12}"
                                class="w-full obsidian-sub px-2 py-2.5 text-sm text-center text-white tabular focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] text-zinc-400 mb-1">Вес (кг)</label>
                            <input id="prog-ex-weight" type="number" inputmode="decimal" step="0.5" placeholder="—" value="${cur?.targetWeight || ''}"
                                class="w-full obsidian-sub px-2 py-2.5 text-sm text-center text-white tabular focus:outline-none">
                        </div>
                    </div>
                    <button onclick="saveProgExModal('${progId}', ${exIdx})"
                        class="w-full py-3.5 rounded-[14px] bg-[#A78BFA] text-[#0B0B0E] font-semibold text-sm btn-press">
                        Сохранить
                    </button>
                </div>
            `);
        }

        function saveProgExModal(progId, exIdx) {
            const prog = state.programs.find(p => p.id === progId);
            if (!prog) return;
            const name = document.getElementById('prog-ex-name').value.trim();
            const muscle = document.getElementById('prog-ex-muscle').value;
            const targetSets = parseInt(document.getElementById('prog-ex-sets').value) || 3;
            const targetReps = parseInt(document.getElementById('prog-ex-reps').value) || 12;
            const wRaw = document.getElementById('prog-ex-weight').value;
            const targetWeight = wRaw === '' ? '' : parseFloat(wRaw);

            if (!name) return toast('Введите название упражнения', 'error');

            if (exIdx !== null && prog.exercises[exIdx]) {
                prog.exercises[exIdx] = { ...prog.exercises[exIdx], name, muscle, targetSets, targetReps, targetWeight };
            } else {
                prog.exercises.push({
                    id: 'pex_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                    name,
                    muscle,
                    targetSets,
                    targetReps,
                    targetWeight
                });
            }

            delete state.drafts[progId];
            saveState();
            closeModal();
            render();
            toast('Упражнение сохранено');
        }

        function moveProgEx(progId, idx, dir) {
            const prog = state.programs.find(p => p.id === progId);
            if (!prog) return;
            const to = idx + dir;
            if (to < 0 || to >= prog.exercises.length) return;
            [prog.exercises[idx], prog.exercises[to]] = [prog.exercises[to], prog.exercises[idx]];
            delete state.drafts[progId];
            saveState();
            render();
        }

        function deleteProgEx(progId, idx) {
            const prog = state.programs.find(p => p.id === progId);
            if (!prog) return;
            prog.exercises.splice(idx, 1);
            delete state.drafts[progId];
            saveState();
            render();
            toast('Удалено из программы');
        }

        /**
         * ============================================================================
         * 8. ВКЛАДКА 3: ПРОГРЕСС, КАЛЕНДАРЬ И АНАЛИТИКА
         * ============================================================================
         */
        function renderProgressTab() {
            const today = todayISO();
            const weekStart = getStartOfWeekISO(today);
            const monthPrefix = today.slice(0, 7); // YYYY-MM

            const todayLogs = state.workouts.filter(w => w.date === today);
            const weekLogs = state.workouts.filter(w => w.date >= weekStart && w.date <= today);
            const monthLogs = state.workouts.filter(w => w.date.startsWith(monthPrefix));

            const volToday = todayLogs.reduce((s, w) => s + w.totalVolume, 0);
            const volWeek = weekLogs.reduce((s, w) => s + w.totalVolume, 0);
            const volMonth = monthLogs.reduce((s, w) => s + w.totalVolume, 0);

            // Разбивка нагрузки по группам мышц за текущий месяц (или все записи, если за месяц пусто)
            const sourceForMuscles = monthLogs.length > 0 ? monthLogs : state.workouts;
            const muscleStats = {};
            let maxVol = 0;

            sourceForMuscles.forEach(w => {
                w.entries.forEach(e => {
                    const m = e.muscle || 'Ягодицы';
                    if (!muscleStats[m]) muscleStats[m] = { vol: 0, sets: 0 };
                    e.sets.forEach(s => {
                        muscleStats[m].vol += (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0);
                        muscleStats[m].sets += 1;
                    });
                    if (muscleStats[m].vol > maxVol) maxVol = muscleStats[m].vol;
                });
            });

            const muscleBarsHtml = Object.keys(muscleStats).length === 0
                ? `<p class="text-xs text-zinc-500 text-center py-3">Завершите первую тренировку, чтобы увидеть распределение нагрузки</p>`
                : Object.entries(muscleStats)
                    .sort((a, b) => b[1].vol - a[1].vol)
                    .map(([m, info]) => {
                        const pct = maxVol > 0 ? Math.max(8, Math.round((info.vol / maxVol) * 100)) : 8;
                        const st = MUSCLE_STYLES[m] || MUSCLE_STYLES['Ягодицы'];
                        return `
                            <div class="space-y-1.5">
                                <div class="flex items-center justify-between gap-2 text-xs">
                                    <span class="font-medium text-zinc-200 truncate">${esc(m)} <span class="text-zinc-500 tabular">(${info.sets} подх.)</span></span>
                                    <span class="font-semibold text-white tabular shrink-0">${fmtNum(info.vol)} кг</span>
                                </div>
                                <div class="w-full h-1.5 bg-white/[0.05] rounded-full overflow-hidden">
                                    <div class="h-full ${st.dot} rounded-full" style="width: ${pct}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('');

            // Детали выбранной даты в календаре
            const selDate = state.calendar.selectedDate;
            const dayWorkouts = state.workouts.filter(w => w.date === selDate);
            const dayAiComment = state.aiData.dateComments[selDate];

            const dayAiHtml = dayAiComment ? `
                <div class="p-3 rounded-[14px] bg-[#A78BFA]/10 border border-[#A78BFA]/20 space-y-1">
                    <div class="text-[11px] font-semibold text-[#A78BFA]">✦ Комментарий ИИ-тренера</div>
                    <p class="text-xs text-zinc-200 leading-relaxed break-words">${esc(dayAiComment)}</p>
                </div>
            ` : '';

            const dayWorkoutsHtml = dayWorkouts.length === 0
                ? `<p class="text-xs text-zinc-500 text-center py-3">В этот день тренировок не записано</p>`
                : dayWorkouts.map(w => `
                    <div class="p-3.5 rounded-[16px] bg-white/[0.03] border border-white/[0.06] space-y-2.5">
                        <div class="flex items-start justify-between gap-2">
                            <div class="min-w-0">
                                <div class="text-xs font-semibold text-[#A78BFA] truncate">${esc(w.dayName)}</div>
                                <div class="text-[11px] text-zinc-400 tabular mt-0.5">
                                    Тоннаж: <span class="text-white font-medium">${fmtNum(w.totalVolume)} кг</span>
                                    ${w.durationSec ? ` · ${formatDuration(w.durationSec)}` : ''}
                                </div>
                            </div>
                            <button onclick="deleteSavedWorkout('${w.id}')" class="px-2.5 py-1 rounded-lg bg-[#FDA4AF]/10 text-[#FDA4AF] text-[11px] font-medium shrink-0 btn-press">
                                Удалить тренировку
                            </button>
                        </div>

                        ${w.feelingNote ? `
                            <div class="px-2.5 py-2 rounded-xl bg-white/[0.03] text-[11px] text-zinc-300 italic break-words">
                                «${esc(w.feelingNote)}»
                            </div>
                        ` : ''}

                        <div class="space-y-1.5 pt-1 border-t border-white/[0.06]">
                            ${w.entries.map(e => `
                                <div class="text-xs flex items-baseline justify-between gap-2">
                                    <span class="text-zinc-200 font-medium truncate">${esc(e.name)}</span>
                                    <span class="text-[11px] text-zinc-400 tabular shrink-0">${e.sets.map(s => `${s.weight}×${s.reps}`).join(', ')}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');

            // Прогресс рабочих весов по выбранному упражнению
            const uniqueEx = Array.from(new Set(state.workouts.flatMap(w => w.entries.map(e => e.name)))).sort();
            if (uniqueEx.length > 0 && !uniqueEx.includes(state.calendar.selectedExercise)) {
                state.calendar.selectedExercise = uniqueEx[0];
            }

            const exProgressCard = uniqueEx.length === 0 ? '' : (() => {
                const target = state.calendar.selectedExercise;
                const points = [...state.workouts]
                    .sort((a, b) => a.date.localeCompare(b.date))
                    .map(w => {
                        const found = w.entries.find(e => e.name === target);
                        if (!found) return null;
                        const maxW = Math.max(...found.sets.map(s => parseFloat(s.weight) || 0));
                        const vol = found.sets.reduce((acc, s) => acc + (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0), 0);
                        return { date: w.date, maxW, vol, sets: found.sets };
                    })
                    .filter(Boolean);

                return `
                    <div class="obsidian-card p-4 space-y-3">
                        <h3 class="text-sm font-semibold text-white">Динамика весов в упражнении</h3>
                        <select onchange="changeProgressExercise(this.value)" class="w-full obsidian-sub px-3.5 py-2.5 text-xs font-medium text-white focus:outline-none">
                            ${uniqueEx.map(n => `<option value="${esc(n)}" ${n === target ? 'selected' : ''}>${esc(n)}</option>`).join('')}
                        </select>
                        <div class="space-y-1.5">
                            ${points.slice(-6).reverse().map(pt => `
                                <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-white/[0.025] border border-white/[0.05] text-xs tabular">
                                    <div class="min-w-0">
                                        <div class="text-zinc-200 font-medium">${fmtDateHuman(pt.date)}</div>
                                        <div class="text-[11px] text-zinc-500 truncate">${pt.sets.map(s => `${s.weight}×${s.reps}`).join(', ')}</div>
                                    </div>
                                    <div class="text-right shrink-0">
                                        <div class="font-semibold text-[#6EE7B7]">Макс: ${pt.maxW} кг</div>
                                        <div class="text-[11px] text-zinc-500">${fmtNum(pt.vol)} кг</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            })();

            return `
                <!-- 3 карточки объёма: Сутки, Неделя, Месяц -->
                <div class="grid grid-cols-3 gap-2">
                    <div class="obsidian-card p-3 min-w-0">
                        <div class="text-[10px] font-medium text-zinc-400 truncate">Сутки</div>
                        <div class="text-sm sm:text-base font-bold text-white tabular mt-1 truncate">${fmtNum(volToday)} <span class="text-[10px] font-normal text-zinc-500">кг</span></div>
                        <div class="text-[10px] text-zinc-500 tabular mt-0.5">${todayLogs.length} трен.</div>
                    </div>
                    <div class="obsidian-card p-3 min-w-0">
                        <div class="text-[10px] font-medium text-zinc-400 truncate">Неделя</div>
                        <div class="text-sm sm:text-base font-bold text-[#A78BFA] tabular mt-1 truncate">${fmtNum(volWeek)} <span class="text-[10px] font-normal text-zinc-500">кг</span></div>
                        <div class="text-[10px] text-zinc-500 tabular mt-0.5">${weekLogs.length} трен.</div>
                    </div>
                    <div class="obsidian-card p-3 min-w-0">
                        <div class="text-[10px] font-medium text-zinc-400 truncate">Месяц</div>
                        <div class="text-sm sm:text-base font-bold text-[#6EE7B7] tabular mt-1 truncate">${fmtNum(volMonth)} <span class="text-[10px] font-normal text-zinc-500">кг</span></div>
                        <div class="text-[10px] text-zinc-500 tabular mt-0.5">${monthLogs.length} трен.</div>
                    </div>
                </div>

                <!-- Интерактивный календарь -->
                <div class="obsidian-card p-4 space-y-3">
                    ${renderCalendarGrid()}
                    <div class="pt-3 border-t border-white/[0.06] space-y-2.5">
                        <div class="text-xs font-medium text-zinc-400">${fmtDateHuman(selDate)}</div>
                        ${dayAiHtml}
                        ${dayWorkoutsHtml}
                    </div>
                </div>

                <!-- Объём по группам мышц -->
                <div class="obsidian-card p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-white">Нагрузка по группам мышц</h3>
                        <span class="text-[11px] text-zinc-500">${monthLogs.length > 0 ? 'За месяц' : 'Всего'}</span>
                    </div>
                    <div class="space-y-3 pt-1">
                        ${muscleBarsHtml}
                    </div>
                </div>

                ${exProgressCard}
            `;
        }

        function renderCalendarGrid() {
            const y = state.calendar.year;
            const m = state.calendar.month;
            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            const first = new Date(y, m, 1);
            const offset = (first.getDay() + 6) % 7;
            const totalDays = new Date(y, m + 1, 0).getDate();
            const today = todayISO();

            const workoutDates = new Set(state.workouts.map(w => w.date));
            const aiDates = new Set(Object.keys(state.aiData.dateComments));

            let cells = '';
            for (let i = 0; i < offset; i++) cells += `<div></div>`;
            for (let d = 1; d <= totalDays; d++) {
                const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isSel = iso === state.calendar.selectedDate;
                const isToday = iso === today;
                const hasW = workoutDates.has(iso);
                const hasAi = aiDates.has(iso);

                cells += `
                    <button onclick="selectCalDate('${iso}')"
                        class="h-10 rounded-xl flex flex-col items-center justify-center text-xs tabular transition-all btn-press ${
                            isSel
                            ? 'bg-[#A78BFA] text-[#0B0B0E] font-bold'
                            : isToday
                            ? 'bg-white/[0.08] text-white font-semibold'
                            : 'text-zinc-300 hover:bg-white/[0.04]'
                        }">
                        <span>${d}</span>
                        <div class="flex items-center gap-0.5 h-1.5 mt-0.5">
                            ${hasW ? `<span class="w-1.5 h-1.5 rounded-full ${isSel ? 'bg-[#0B0B0E]' : 'bg-[#A78BFA]'}"></span>` : ''}
                            ${hasAi ? `<span class="w-1.5 h-1.5 rounded-full ${isSel ? 'bg-white' : 'bg-[#6EE7B7]'}"></span>` : ''}
                        </div>
                    </button>
                `;
            }

            return `
                <div class="flex items-center justify-between gap-2">
                    <button onclick="shiftCalendarMonth(-1)" class="icon-btn text-zinc-300 btn-press" aria-label="Предыдущий месяц">‹</button>
                    <div class="text-sm font-semibold text-white">${monthNames[m]} ${y}</div>
                    <button onclick="shiftCalendarMonth(1)" class="icon-btn text-zinc-300 btn-press" aria-label="Следующий месяц">›</button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-medium text-zinc-500 pt-1">
                    <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div>
                </div>
                <div class="grid grid-cols-7 gap-1">${cells}</div>
            `;
        }

        function shiftCalendarMonth(delta) {
            let m = state.calendar.month + delta;
            let y = state.calendar.year;
            if (m < 0) { m = 11; y--; }
            if (m > 11) { m = 0; y++; }
            state.calendar.month = m;
            state.calendar.year = y;
            render();
        }

        function selectCalDate(iso) {
            state.calendar.selectedDate = iso;
            render();
        }

        function jumpCalendarToday() {
            const now = new Date();
            state.calendar.year = now.getFullYear();
            state.calendar.month = now.getMonth();
            state.calendar.selectedDate = todayISO(now);
            render();
        }

        function changeProgressExercise(name) {
            state.calendar.selectedExercise = name;
            render();
        }

        function deleteSavedWorkout(id) {
            state.workouts = state.workouts.filter(w => w.id !== id);
            saveState();
            render();
            toast('Тренировка удалена из истории');
        }

        /**
         * ============================================================================
         * 9. ВКЛАДКА 4: ДВУСТОРОННЯЯ СИНХРОНИЗАЦИЯ С ИИ, CSV И JSON БЭКАП
         * ============================================================================
         */
        function buildFullAiSyncPrompt() {
            const payload = {
                programs: state.programs,
                workouts: state.workouts,
                current_ai_notes: state.aiData
            };

            return `Ты мой персональный фитнес-тренер. Проанализируй мои данные из приложения VelvetLog (программу, историю тренировок и мои заметки о самочувствии) и верни ТОЛЬКО валидный JSON-объект без лишнего текста, чтобы я могла загрузить его обратно в приложение.

Строгий формат JSON-ответа:
{
  "general_comment": "Общий вывод по прогрессу, восстановлению и нагрузке",
  "ai_comments": [
    {
      "exercise_id": "ID упражнения из программы (если есть)",
      "exercise_name": "Точное название упражнения",
      "date": "${todayISO()}",
      "comment": "Персональный совет по технике, прогрессии веса или восстановлению"
    }
  ],
  "program_updates": [
    {

      "replace_with_name": "Новое название (заполнять ТОЛЬКО если предлагаешь заменить упражнение)"
    }
  ]
}

Примечание: в массиве "ai_comments" можно привязывать совет либо к упражнению (через exercise_id / exercise_name), либо к конкретной дате тренировки (указав поле "date" без exercise_name).

МОИ ДАННЫЕ ИЗ ПРИЛОЖЕНИЯ:
${JSON.stringify(payload, null, 2)}`;
        }

        function copyStarterProgramPrompt() {
            const prompt = `Составь для меня программу тренировок в тренажёрном зале и верни ответ ТОЛЬКО в виде валидного JSON без лишнего текста, чтобы я могла загрузить его в приложение VelvetLog.

Формат JSON:
{
  "general_comment": "Краткое пояснение по программе и отдыху",

}

Допустимые значения поля "muscle": Ягодицы, Ноги, Спина, Грудь, Плечи, Бицепс, Трицепс, Пресс.`;
            copyToClipboard(prompt, 'Промпт для создания программы скопирован');

        function renderAiTab() {

            const activeNotesHtml = !hasAnyAi ? `
                <p class="text-xs text-zinc-500 text-center py-3">

            ` : `

                        <div class="p-3.5 rounded-[15px] bg-[#A78BFA]/10 border border-[#A78BFA]/25 space-y-1">

                                <div class="text-[11px] font-semibold text-[#6EE7B7] tabular">${fmtDateHuman(iso)}</div>

            `;

            return `

                        <div class="text-[11px] font-semibold text-[#A78BFA]">Шаг 1</div>

                        <p class="text-xs text-zinc-400 leading-relaxed">
