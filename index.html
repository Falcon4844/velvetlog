<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VelvetLog">
    <meta name="theme-color" content="#0B0B0E">
    <title>VelvetLog — Трекер тренировок и ИИ-тренер</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA Манифест и иконка для добавления на экран «Домой» iPhone -->
    <script>
        (function() {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#A78BFA"/>
                        <stop offset="100%" stop-color="#FDA4AF"/>
                    </linearGradient>
                </defs>
                <rect width="512" height="512" rx="120" fill="#0B0B0E"/>
                <circle cx="256" cy="256" r="154" fill="none" stroke="url(#g)" stroke-width="26"/>
                <path d="M186 258l48 48 96-102" fill="none" stroke="#6EE7B7" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>`;
            const iconUrl = 'data:image/svg+xml;base64,' + btoa(svg);

            const touchIcon = document.createElement('link');
            touchIcon.rel = 'apple-touch-icon';
            touchIcon.href = iconUrl;
            document.head.appendChild(touchIcon);

            const manifest = {
                name: "VelvetLog",
                short_name: "VelvetLog",
                start_url: ".",
                display: "standalone",
                background_color: "#0B0B0E",
                theme_color: "#0B0B0E",
                icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml" }]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = URL.createObjectURL(blob);
            document.head.appendChild(manifestLink);
        })();
    </script>

    <style>
        :root {
            --bg-obsidian: #0B0B0E;
            --bg-card: #141419;
            --bg-elevated: #1C1C24;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background-color: var(--bg-obsidian);
            color: #F4F4F6;
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .tabular {
            font-variant-numeric: tabular-nums;
        }

        .obsidian-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.065);
            border-radius: 22px;
        }

        .obsidian-sub {
            background-color: var(--bg-elevated);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
        }

        .glass-header {
            background: rgba(11, 11, 14, 0.85);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .glass-nav {
            background: rgba(14, 14, 19, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .btn-press {
            transition: transform 0.13s cubic-bezier(0.2, 0, 0, 1), opacity 0.15s ease, background-color 0.15s ease;
        }

        .btn-press:active {
            transform: scale(0.965);
            opacity: 0.88;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            min-width: 34px;
            min-height: 34px;
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .safe-top { padding-top: max(12px, var(--sat)); }
        .safe-bottom { padding-bottom: max(10px, var(--sab)); }
        .main-bottom-pad { padding-bottom: calc(148px + var(--sab)); }

        @keyframes sheetIn {
            from { transform: translateY(100%); opacity: 0.5; }
            to { transform: translateY(0); opacity: 1; }
        }
        .sheet-in {
            animation: sheetIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pillUp {
            from { transform: translate(-50%, 24px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .rest-pill-in {
            animation: pillUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#0B0B0E] text-zinc-100 selection:bg-[#A78BFA]/30">

    <!-- Всплывающие уведомления (Toast) -->
    <div id="toast-root" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-[92%] max-w-md flex flex-col gap-2 safe-top"></div>

    <!-- Модальная шторка (Bottom Sheet) -->
    <div id="modal-backdrop" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-md flex items-end sm:items-center justify-center">
        <div id="modal-sheet" class="w-full max-w-lg bg-[#141419] border-t sm:border border-white/10 rounded-t-[28px] sm:rounded-[26px] p-5 max-h-[88vh] flex flex-col shadow-2xl safe-bottom sheet-in">
            <div class="w-10 h-1 bg-zinc-700/80 rounded-full mx-auto mb-3.5 sm:hidden shrink-0"></div>
            <div class="flex items-center justify-between gap-3 mb-4 shrink-0">
                <h3 id="modal-title" class="text-[17px] font-semibold tracking-tight text-white truncate min-w-0">Заголовок</h3>
                <button onclick="closeModal()" class="icon-btn text-zinc-400 hover:text-white btn-press" aria-label="Закрыть">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="modal-content" class="overflow-y-auto flex-1 space-y-3.5 pr-0.5"></div>
        </div>
    </div>

    <!-- Плавающая капсула умного таймера отдыха -->
    <div id="rest-timer-pill" class="hidden fixed left-1/2 -translate-x-1/2 z-40 w-[94%] max-w-md rest-pill-in" style="bottom: calc(74px + var(--sab));">
        <div class="bg-[#191922]/95 backdrop-blur-xl border border-[#A78BFA]/30 rounded-[20px] px-3.5 py-2.5 shadow-2xl shadow-black/60 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-2 h-2 rounded-full bg-[#A78BFA] animate-pulse shrink-0"></div>
                <div class="min-w-0">
                    <div class="text-[10px] font-medium text-zinc-400 leading-none">Отдых</div>
                    <div id="rest-countdown" class="text-base font-bold text-white tabular leading-tight mt-0.5">01:30</div>
                </div>
            </div>

            <!-- Пресеты времени -->
            <div class="flex items-center gap-1 shrink-0">
                <button onclick="setRestDuration(60)" data-rest-preset="60" class="rest-preset px-2 py-1 rounded-lg text-[11px] font-medium tabular bg-white/[0.05] text-zinc-300 btn-press">60с</button>
                <button onclick="setRestDuration(90)" data-rest-preset="90" class="rest-preset px-2 py-1 rounded-lg text-[11px] font-medium tabular bg-[#A78BFA]/20 text-[#A78BFA] btn-press">90с</button>
                <button onclick="setRestDuration(120)" data-rest-preset="120" class="rest-preset px-2 py-1 rounded-lg text-[11px] font-medium tabular bg-white/[0.05] text-zinc-300 btn-press">120с</button>
            </div>

            <!-- +15с и пропуск -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="addRestSeconds(15)" class="px-2.5 py-1.5 rounded-xl bg-white/[0.07] text-xs font-semibold text-zinc-200 tabular btn-press">+15с</button>
                <button onclick="stopRestTimer()" class="w-8 h-8 rounded-xl bg-white/[0.05] text-zinc-400 hover:text-white flex items-center justify-center btn-press" aria-label="Пропустить отдых">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Главный каркас приложения -->
    <div class="max-w-lg mx-auto min-h-screen flex flex-col">
        <!-- Верхняя шапка -->
        <header id="app-header" class="sticky top-0 z-30 glass-header px-4 pb-3 safe-top"></header>

        <!-- Основная область -->
        <main id="view-root" class="flex-1 px-4 pt-4 main-bottom-pad space-y-4"></main>

        <!-- Нижняя панель навигации (4 вкладки) -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 glass-nav safe-bottom">
            <div class="max-w-lg mx-auto grid grid-cols-4 h-[64px] px-2">
                <button onclick="setTab('workout')" data-nav="workout" class="nav-btn flex flex-col items-center justify-center gap-1 text-[#A78BFA] btn-press">
                    <svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    <span class="text-[10px] font-medium tracking-tight">Тренировка</span>
                </button>
                <button onclick="setTab('program')" data-nav="program" class="nav-btn flex flex-col items-center justify-center gap-1 text-zinc-500 btn-press">
                    <svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    <span class="text-[10px] font-medium tracking-tight">Программа</span>
                </button>
                <button onclick="setTab('progress')" data-nav="progress" class="nav-btn flex flex-col items-center justify-center gap-1 text-zinc-500 btn-press">
                    <svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span class="text-[10px] font-medium tracking-tight">Прогресс</span>
                </button>
                <button onclick="setTab('ai')" data-nav="ai" class="nav-btn flex flex-col items-center justify-center gap-1 text-zinc-500 btn-press">
                    <svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"/></svg>
                    <span class="text-[10px] font-medium tracking-tight">Тренер ИИ</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. КОНФИГУРАЦИЯ МЫШЦ, ЦВЕТОВ И ЛОКАЛЬНОГО ХРАНИЛИЩА (СТРОГО ПУСТОЙ СТАРТ)
         * ============================================================================
         */
        const STORAGE_KEY = 'velvetlog_v1_clean';

        const MUSCLE_STYLES = {
            'Ягодицы':  { dot: 'bg-[#FDA4AF]', badge: 'bg-[#FDA4AF]/12 text-[#FDA4AF] border-[#FDA4AF]/25' },
            'Ноги':     { dot: 'bg-[#FDBA74]', badge: 'bg-[#FDBA74]/12 text-[#FDBA74] border-[#FDBA74]/25' },
            'Спина':    { dot: 'bg-[#A78BFA]', badge: 'bg-[#A78BFA]/12 text-[#A78BFA] border-[#A78BFA]/25' },
            'Грудь':    { dot: 'bg-[#6EE7B7]', badge: 'bg-[#6EE7B7]/12 text-[#6EE7B7] border-[#6EE7B7]/25' },
            'Плечи':    { dot: 'bg-[#93C5FD]', badge: 'bg-[#93C5FD]/12 text-[#93C5FD] border-[#93C5FD]/25' },
            'Бицепс':   { dot: 'bg-[#F9A8D4]', badge: 'bg-[#F9A8D4]/12 text-[#F9A8D4] border-[#F9A8D4]/25' },
            'Трицепс':  { dot: 'bg-[#C4B5FD]', badge: 'bg-[#C4B5FD]/12 text-[#C4B5FD] border-[#C4B5FD]/25' },
            'Пресс':    { dot: 'bg-[#5EEAD4]', badge: 'bg-[#5EEAD4]/12 text-[#5EEAD4] border-[#5EEAD4]/25' }
        };

        const MUSCLE_LIST = Object.keys(MUSCLE_STYLES);

        function todayISO(d = new Date()) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function shiftISO(iso, days) {
            const [y, m, d] = iso.split('-').map(Number);
            return todayISO(new Date(y, m - 1, d + days));
        }

        // Начальное состояние — строго пустое (никаких демо-программ и фейковых логов)
        let state = {
            tab: 'workout',
            selectedDayId: null, // null | 'free' | programDay.id
            groupByMuscle: true,
            sessionStartedAt: null,
            programs: [],       // [{ id, name, exercises: [{ id, name, muscle, targetSets, targetReps, targetWeight }] }]
            workouts: [],       // [{ id, date, dayId, dayName, totalVolume, durationSec, feelingNote, entries: [{ exerciseId, name, muscle, sets: [{weight, reps, done}] }] }]
            aiData: {
                generalComment: '',
                dateComments: {},     // { 'YYYY-MM-DD': 'текст' }
                exerciseComments: {}  // { 'id_or_norm_name': { label, comment } }
            },
            drafts: {},         // { [sessionId]: { exercises: [...], sets: { [exId]: [{ weight, reps, done }] } } }
            calendar: {
                year: new Date().getFullYear(),
                month: new Date().getMonth(),
                selectedDate: todayISO(),
                selectedExercise: ''
            },
            restPreset: 90
        };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                state.programs = Array.isArray(parsed.programs) ? parsed.programs : [];
                state.workouts = Array.isArray(parsed.workouts) ? parsed.workouts : [];
                state.aiData = {
                    generalComment: parsed.aiData?.generalComment || '',
                    dateComments: parsed.aiData?.dateComments || {},
                    exerciseComments: parsed.aiData?.exerciseComments || {}
                };
                state.drafts = parsed.drafts || {};
                state.selectedDayId = parsed.selectedDayId || (state.programs[0]?.id || null);
                if (typeof parsed.groupByMuscle === 'boolean') state.groupByMuscle = parsed.groupByMuscle;
                if (parsed.restPreset) state.restPreset = parsed.restPreset;
            } catch (e) {
                console.error('Ошибка чтения localStorage:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    programs: state.programs,
                    workouts: state.workouts,
                    aiData: state.aiData,
                    drafts: state.drafts,
                    selectedDayId: state.selectedDayId,
                    groupByMuscle: state.groupByMuscle,
                    restPreset: state.restPreset
                }));
            } catch (e) {
                toast('Не удалось сохранить данные в память', 'error');
            }
        }

        /**
         * ============================================================================
         * 2. ТАЙМЕР ТРЕНИРОВКИ, УМНЫЙ ТАЙМЕР ОТДЫХА + WEB AUDIO API СИГНАЛ
         * ============================================================================
         */
        let sessionTimerInterval = null;
        let restTimerInterval = null;
        let restRemainingSec = 0;

        function ensureSessionTimer() {
            if (!state.sessionStartedAt) state.sessionStartedAt = Date.now();
            if (!sessionTimerInterval) {
                sessionTimerInterval = setInterval(() => {
                    const el = document.getElementById('header-elapsed');
                    if (el && state.sessionStartedAt) {
                        el.textContent = formatDuration(Math.floor((Date.now() - state.sessionStartedAt) / 1000));
                    }
                }, 1000);
            }
        }

        function formatDuration(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function playGentleChime() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;

                [523.25, 659.25].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.14);

                    gain.gain.setValueAtTime(0.001, now + i * 0.14);
                    gain.gain.exponentialRampToValueAtTime(0.12, now + i * 0.14 + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 0.55);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.14);
                    osc.stop(now + i * 0.14 + 0.6);
                });
            } catch (e) {
                // Игнорируем ограничения автовоспроизведения звука, если есть
            }
            if (navigator.vibrate) {
                try { navigator.vibrate([120, 60, 120]); } catch (e) {}
            }
        }

        function startRestTimer(seconds = state.restPreset) {
            restRemainingSec = seconds;
            updateRestPillUI();
            const pill = document.getElementById('rest-timer-pill');
            pill.classList.remove('hidden');

            clearInterval(restTimerInterval);
            restTimerInterval = setInterval(() => {
                restRemainingSec--;
                if (restRemainingSec <= 0) {
                    stopRestTimer();
                    playGentleChime();
                    toast('Отдых завершён — можно делать следующий подход');
                } else {
                    updateRestPillUI();
                }
            }, 1000);
        }

        function setRestDuration(sec) {
            state.restPreset = sec;
            saveState();
            startRestTimer(sec);
        }

        function addRestSeconds(sec) {
            restRemainingSec += sec;
            updateRestPillUI();
        }

        function stopRestTimer() {
            clearInterval(restTimerInterval);
            restTimerInterval = null;
            restRemainingSec = 0;
            const pill = document.getElementById('rest-timer-pill');
            if (pill) pill.classList.add('hidden');
        }

        function updateRestPillUI() {
            const el = document.getElementById('rest-countdown');
            if (el) el.textContent = formatDuration(Math.max(0, restRemainingSec));
            document.querySelectorAll('.rest-preset').forEach(btn => {
                const isCur = Number(btn.dataset.restPreset) === state.restPreset;
                btn.className = `rest-preset px-2 py-1 rounded-lg text-[11px] font-medium tabular btn-press ${
                    isCur ? 'bg-[#A78BFA]/20 text-[#A78BFA]' : 'bg-white/[0.05] text-zinc-400'
                }`;
            });
        }

        /**
         * ============================================================================
         * 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ UI
         * ============================================================================
         */
        function toast(msg, type = 'ok') {
            const root = document.getElementById('toast-root');
            const el = document.createElement('div');
            const style = type === 'error'
                ? 'bg-rose-950/95 border-[#FDA4AF]/30 text-[#FDA4AF]'
                : 'bg-[#1C1C24]/95 border-[#A78BFA]/25 text-zinc-100';
            el.className = `px-4 py-3 rounded-2xl border ${style} shadow-2xl backdrop-blur-xl text-xs font-medium transition-all duration-300 opacity-0 -translate-y-2 break-words`;
            el.textContent = msg;
            root.appendChild(el);
            requestAnimationFrame(() => el.classList.remove('opacity-0', '-translate-y-2'));
            setTimeout(() => {
                el.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => el.remove(), 260);
            }, 2800);
        }

        function openModal(title, html) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        document.getElementById('modal-backdrop').addEventListener('click', (e) => {
            if (e.target.id === 'modal-backdrop') closeModal();
        });

        function copyToClipboard(text, successMsg = 'Скопировано в буфер обмена') {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => toast(successMsg))
                    .catch(() => fallbackCopy(text, successMsg));
            } else {
                fallbackCopy(text, successMsg);
            }
        }

        function fallbackCopy(text, successMsg) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                toast(successMsg);
            } catch (e) {
                toast('Не удалось скопировать', 'error');
            }
            document.body.removeChild(ta);
        }

        function esc(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function normKey(str) {
            return String(str || '').trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function fmtNum(n) {
            return Math.round(n || 0).toLocaleString('ru-RU');
        }

        function fmtDateHuman(iso) {
            if (!iso) return '';
            const [y, m, d] = iso.split('-').map(Number);
            const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            const now = todayISO();
            if (iso === now) return `Сегодня, ${d} ${months[m - 1]}`;
            if (iso === shiftISO(now, -1)) return `Вчера, ${d} ${months[m - 1]}`;
            return `${d} ${months[m - 1]} ${y}`;
        }

        function getLastPerformance(exName) {
            const key = normKey(exName);
            const sorted = [...state.workouts].sort((a, b) => b.date.localeCompare(a.date));
            for (const w of sorted) {
                const found = w.entries.find(e => normKey(e.name) === key);
                if (found && Array.isArray(found.sets) && found.sets.length > 0) {
                    return { date: w.date, sets: found.sets };
                }
            }
            return null;
        }

        function getAiTipForExercise(ex) {
            if (ex.id && state.aiData.exerciseComments[ex.id]) {
                return state.aiData.exerciseComments[ex.id].comment;
            }
            const k = normKey(ex.name);
            if (state.aiData.exerciseComments[k]) {
                return state.aiData.exerciseComments[k].comment;
            }
            return '';
        }

        function getStartOfWeekISO(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            const day = (date.getDay() + 6) % 7; // Пн = 0
            date.setDate(date.getDate() - day);
            return todayISO(date);
        }

        /**
         * ============================================================================
         * 4. НАВИГАЦИЯ ПО ВКЛАДКАМ
         * ============================================================================
         */
        function setTab(tab) {
            state.tab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const active = btn.dataset.nav === tab;
                btn.classList.toggle('text-[#A78BFA]', active);
                btn.classList.toggle('text-zinc-500', !active);
            });
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            const header = document.getElementById('app-header');
            const root = document.getElementById('view-root');

            if (state.tab === 'workout') {

                            </div>

                    root.innerHTML = renderOnboarding();

                    renderActiveWorkoutView(header, root);

            } else if (state.tab === 'program') {
                header.innerHTML = `
                    <div class="flex items-center justify-between gap-3">
                        <div class="min-w-0">
                            <h1 class="text-xl font-bold tracking-tight text-white">Программа</h1>
                            <p class="text-xs text-zinc-500 mt-0.5 truncate">${state.programs.length ? `Тренировочных дней: ${state.programs.length}` : 'Создайте или загрузите план'}</p>
                        </div>
                        <button onclick="openDayModal()" class="px-3.5 py-2 rounded-xl bg-[#A78BFA] text-[#0B0B0E] text-xs font-semibold shrink-0 btn-press">
                            + Новый день
                        </button>
                    </div>
                `;
                root.innerHTML = renderProgramTab();
            } else if (state.tab === 'progress') {
                header.innerHTML = `
                    <div class="flex items-center justify-between gap-3">
                        <div class="min-w-0">
                            <h1 class="text-xl font-bold tracking-tight text-white">Прогресс</h1>
                            <p class="text-xs text-zinc-500 mt-0.5">Календарь и объём нагрузки</p>
                        </div>
                        <button onclick="jumpCalendarToday()" class="px-3 py-1.5 rounded-xl bg-white/[0.05] border border-white/[0.08] text-xs font-medium text-zinc-300 shrink-0 btn-press">
                            Сегодня
                        </button>
                    </div>
                `;
                root.innerHTML = renderProgressTab();
            } else if (state.tab === 'ai') {
                header.innerHTML = `
                    <div class="flex items-center justify-between gap-3">
                        <div class="min-w-0">
                            <h1 class="text-xl font-bold tracking-tight text-white">Тренер ИИ</h1>
                            <p class="text-xs text-zinc-500 mt-0.5">Синхронизация и советы нейросети</p>
                        </div>
                    </div>
                `;
                root.innerHTML = renderAiTab();
            }
        }

        /**
         * ============================================================================
         * 5. ОНБОРДИНГ (ПУСТОЙ СТАРТ БЕЗ ДЕМО-ДАННЫХ)
         * ============================================================================
         */
        function renderOnboarding() {

                            <span>✦ Готово к первой тренировке</span>

                        <h2 class="text-lg font-semibold text-white tracking-tight pt-1">С чего начнём сегодня?</h2>

                        </p>
                    </div>

                    <!-- Карточка 1: Загрузить план от нейросети -->
                    <div class="obsidian-card p-4 space-y-3 border-[#A78BFA]/20">

                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-semibold text-white">Загрузить план от нейросети</div>

                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                        </div>
                        <div class="min-w-0 flex-1">

                            <p class="text-xs text-zinc-400 leading-relaxed mt-0.5">

                            </p>

                    </button>

                    <!-- Карточка 3: Начать свободную тренировку -->
                    <button onclick="startFreeSession()" class="w-full obsidian-card p-4 text-left flex items-start gap-3.5 btn-press">
                        <div class="w-11 h-11 rounded-2xl bg-[#FDBA74]/12 border border-[#FDBA74]/25 flex items-center justify-center text-[#FDBA74] shrink-0 mt-0.5">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
